name: PathAble validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pathable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright-browsers
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frozen development and optional CPU installation
        run: |
          bash scripts/install.sh
          bash scripts/install_ml.sh
      - name: Bundled browser and Ubuntu dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Backend, pure routing and PostGIS integration
        run: bash scripts/test.sh
      - name: CPU pipeline execution fixtures
        run: bash scripts/test_ml.sh
      - name: Contracts, frontend build, components and browser flows
        run: bash scripts/test_frontend.sh
      - name: HTTPS release and coordinated restoration
        run: bash scripts/test_release.sh
      - name: Synthetic browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-browser-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
